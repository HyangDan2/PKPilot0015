    <script>
      /* Apply the saved theme and language before the first paint. The keys
         carry the studio's current name; the ones it used before the rename
         are still read, so a returning visitor keeps their choice. */
      (function () {
        try {
          var theme = localStorage.getItem('framebuilder.theme') || localStorage.getItem('mynda.theme');
          var lang = localStorage.getItem('framebuilder.lang') || localStorage.getItem('mynda.lang');
          document.documentElement.dataset.theme = theme === 'iris' ? 'iris' : 'navy';
          document.documentElement.lang = lang === 'en' ? 'en' : 'ko';
        } catch (error) { /* private mode */ }
      })();
    </script>
